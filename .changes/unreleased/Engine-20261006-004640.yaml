body: 'A campaign scenario can name the modular sets it requires (CampaignNode.requiredModularSetIds): the game start hands them to the builder, campaignModularSetIds adds them to the picked sets, and createGame refuses a campaign game without one; NeXt Evolution''s Juggernaut requires Black Tom Cassidy (MC40 p. 14)'
