kind: Engine
body: 'A "(thwart)" ability that names only a scheme its player cannot thwart (an engaged patrol minion, a crisis icon) can no longer be played: Impede, Looking for Trouble, Running Interference, Brainstorm and Psychic Manipulation; divided thwarts stop offering that scheme, and a blocked thwart is no longer heard by "after you thwart" (RRG 1.8 p. 43)'
