body: 'Three cost primitives: ''remove up to N counters'' sized by the player (spendCounters.upTo, bind), ''discard the top card of your deck'' (discardFromDeck, with the empty-deck rules), and either/or costs (AbilityCost.either); plus AbilityLimit.per ''player'' and optional Command.costSelection / LegalAction.costBranches / costCounters (docs/phase7-wave3.md §3.32, §3.33, §3.36)'
