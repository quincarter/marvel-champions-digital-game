body: 'Progression: the Core Set is always open; each later wave unlocks by play (beat Rhino for Wave 1, a Wave 1 villain for The Rise of Red Skull, the Red Skull campaign for The Galaxy''s Most Wanted), and heroes' precons join one villain at a time (imported and built decks always play). Wins earn champion points. Settings ▸ Unlocks opens everything, one campaign or one hero by hand, for points and after a warning; ?unlock=all opens everything for one session'
