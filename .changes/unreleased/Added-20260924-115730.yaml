kind: Added
body: 'Progression: the Core Set is always open; each later wave unlocks by play (beat Rhino for Wave 1 and The Rise of Red Skull, the Red Skull campaign for The Galaxy''s Most Wanted), and heroes' precons join one villain at a time (imported and built decks always play). Wins earn champion points. Unlock a precon, scenario or campaign with earned points right where it's locked (Seats, Scenario select, the Saga shelf) or in Settings ▸ Unlocks, after a warning; Unlock everything is free and switches points off; Settings ▸ Unlocks ▸ How it works explains it all in the game, and docs/progression.md in the repo; ?unlock=all opens everything for one session'
