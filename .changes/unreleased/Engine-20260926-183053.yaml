kind: Engine
body: An additional thwart cost is paid together with a basic thwart's own cost (declining it, or a take-damage cost partly prevented, leaves the hero unexhausted and nothing thwarted); a divided basic thwart must afford the total; a thwart event's payability is judged after its own cost (docs/phase7-wave5.md §4.1 Q27–Q30).
