body: 'The game no longer climbs in memory round after round: card pictures are kept at the size the table shows them (full size only for the hover and Inspect), painted labels are capped by count, full-screen pictures are scaled to the screen, and Safari and the Mac and Linux apps keep a smaller picture cache.'
