kind: Added
body: The Mod Store is on the main menu (and a storefront button beside the music on tablets and desktops), with an Extras tab for house rules and other add-ons, a Credits tab for the creators, and a search box, sort and tag chips. Thanks to bluefireF5ran for the playtest notes (#734).
