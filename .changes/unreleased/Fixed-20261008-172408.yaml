kind: Fixed
body: An attack ability whose only attack target cannot be attacked cannot be played (Attacrobatics, Swift Retribution, By Any Means, Return the Favor, Browbeat, Fighting Fit, Pivotal Moment, Payback under guard); a cancelled attack ability deals no further damage; a main scheme's counters are returned when it advances, which fixes Magneto's magnet counters
