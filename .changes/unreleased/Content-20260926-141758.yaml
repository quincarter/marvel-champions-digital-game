kind: Content
body: 'scripts/fetch_card_art.py (pnpm card-art) finds the card scans stamped with the FFG preview watermark (177 of them, all from The Mad Titan''s Shadow), replaces scans with larger, unstamped copies from Hall of Heroes, and crops the white padding off card images; the 26 padded photographed scans (Ghost-Spider, Sinister Motives, Galaxy''s Most Wanted) are trimmed.'
