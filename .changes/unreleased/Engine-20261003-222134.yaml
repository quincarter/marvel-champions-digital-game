kind: Engine
body: 'A "(thwart)" ability is one thwart however many schemes it removes threat from: "when you thwart" and "after you thwart" are each heard once (Inconspicuous, Multitasking, Crisis Interdiction, Rapid Deployment, Heroic Intervention), Operative Skill is used once and adds to each instance, and Justice Served reads every thwarted scheme (RRG 1.8 p. 44)'
