kind: Engine
body: A permanent attachment on a host that leaves play through a host step (a villain removed, set aside or defeated while others remain, a main scheme stage removed) is unattached into its controller's play area, or discarded if it is an unowned encounter card, as when a host leaves play normally; on a host that flips and stays in play it stays attached (docs/phase7-wave5.md §4.1 Q50)
