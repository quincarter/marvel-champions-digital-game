kind: Engine
body: "Boost abilities can be ignored while their icons count, boost icons can count multiple times, minions can activate before the villain, and 'cannot be stunned' can name the source. An enemy's attack on another enemy (Moondragon, Headpool, The Punisher) now triggers that enemy's own 'when/after this card is attacked' abilities that name no attacker: Shocker, Speed Demon (who attacks back), Gorgon, Sebastian Shaw, Sidewinder (not dealt away: there is no attacking player), Whiplash, Temporal Shield on Kang, and a villain under Krahllak's Blessing attacks the minion that damaged it. Cards that name the attacker (Black Widow's 'a character you control') still ignore it, and a forced encounter ability nobody resolves now pays a self-discard or counter cost instead of resolving for free"
