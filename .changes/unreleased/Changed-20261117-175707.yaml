body: Every search box now forgives the same way, accents and case ignored, a typo in a longer word and a letter or two left out of a short one ("crd siz" finds Card size); the hero roster, the Rules glossary, the rulebook reader and the campaign card picker join Settings, Pause and the deck and card searches.
