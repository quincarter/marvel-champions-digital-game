body: A cost that picks cards in play (Repurpose's Tech upgrade, Mutant Peacekeepers' allies) is asked on the decision popup, with full card faces that scroll, so every card can be reached on a phone; the board's target picks scroll too when they don't fit (#991, reported by GarethMagis on Discord).
