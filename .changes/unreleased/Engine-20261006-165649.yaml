body: '"You" in a constant ability is read through one resolver by every rule reader: on an obligation, an attachment on a player card or an engaged minion it names that player in every rule''s queries, stat modifiers, keyword and trait grants; a boost card''s own text (I See You''s +1 boost icon) reads the player the activation resolves against'
