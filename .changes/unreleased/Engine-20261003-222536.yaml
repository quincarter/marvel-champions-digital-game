kind: Engine
body: 'Emergency is a thwart: any "(thwart)" ability that reduces the threat a scheme places is a thwart that removes none, so an engaged patrol minion or a "cannot thwart" stops it, "after you thwart" hears it once, a crisis icon does not stop it and thwart bonuses add nothing (RRG 1.8 pp. 26, 32, FAQ p. 59)'
