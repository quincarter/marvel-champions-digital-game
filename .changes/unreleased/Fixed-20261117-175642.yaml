kind: Fixed
body: Silk Sense and other "after you defeat" cards (Interrogation Room, Hall of Heroes, Improved Attack and Thwart Upgrades, Rescue Captives, Change of Fortune) trigger only when your identity, or an event, resource or upgrade of yours, makes the defeat, not an ally or support you control (#817).
