kind: Fixed
body: 'A piercing attack whose damage is dealt as indirect damage or divided among characters now pierces only the attacked character (the defender, or the identity if undefended); other characters keep their tough status cards, and piercing granted to that attack alone now reaches the attacked character (RRG 1.8 pp. 24, 32).'
