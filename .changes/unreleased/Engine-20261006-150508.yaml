body: 'A "would" interrupt resolves before the same event''s other interrupts are gathered (RRG 1.8 "Would", p. 48; owner ruling 2026-10-06): no ordering prompt between Hope''s Captor and a Marauder''s "attacks you" interrupt, and a replaced attack or scheme never opens the later tier. Opted in: every scripted "would attack" and "would scheme" replacement'
