kind: Engine
body: Campaign setup can bring a named card in from outside the game (setAsideCards); an ownerless player card put into play is owned by its controller. Sinister Motives now puts Venom (190) into play in scenarios 3 and 4, and offers each player a Helicarrier / Symbiote Suit for reputation nodes 21 and 25.
