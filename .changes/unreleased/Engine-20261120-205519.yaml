kind: Engine
body: New response event for a card discarded from a hand by a card's ability (cardDiscardedFromHand, with the discarding card's side and effect or cost), and on.cardDiscardedFromHand in the card DSL, so one ability can answer discards from a hand, a deck and play under one limit (#922).
