body: 'A move of threat needs a source its threat can leave (RRG p. 30, owner ruling 2026-10-06): an ability whose moveThreat has no such scheme (a crisis icon, a threat-cannot-be-removed rule, no threat) is not offered and is refused before any cost, with its own reason; a chosen source offers only such schemes; new canRemoveThreatFrom predicate'
