name: Release on Merge to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      publish:
        description: "Publish immediately (false = draft release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  check-and-cut-release:
    name: Check Changes & Cut Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.cut.outputs.should_release || steps.check_changes.outputs.should_release }}
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
      publish: ${{ steps.cut.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all git tags
        run: git fetch --tags --force

      - name: Setup Changie
        uses: miniscruff/changie-action@v3
        with:
          version: latest

      - name: Check for unreleased changes
        id: check_changes
        shell: bash
        run: |
          COUNT=$(find .changes/unreleased -maxdepth 1 \( -name "*.yaml" -o -name "*.yml" \) ! -name ".gitkeep" 2>/dev/null | wc -l)
          echo "Found ${COUNT} unreleased change fragment(s)."
          if [ "${COUNT}" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut Release and Update Changelog
        id: cut
        if: steps.check_changes.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_INPUT: ${{ github.event.inputs.bump || 'auto' }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish || 'false' }}
        run: |
          # 1. Determine next version
          NEXT_TAG=""
          if [ "${BUMP_INPUT}" != "auto" ]; then
            NEXT_TAG=$(changie next "${BUMP_INPUT}")
          else
            NEXT_TAG=$(changie next auto 2>/dev/null || changie next patch)
          fi

          VERSION="${NEXT_TAG#v}"
          TAG="v${VERSION}"
          echo "Target Version: ${VERSION} (tag: ${TAG})"

          # 2. Batch unreleased changes into .changes/${TAG}.md
          changie batch "${TAG}" --allow-no-changes

          # 3. Merge CHANGELOG.md and execute replacements
          changie merge

          # 4. Increment Android versionCode in build.gradle
          GRADLE_FILE="packages/client/android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            CURRENT_CODE=$(grep -oE 'versionCode [0-9]+' "$GRADLE_FILE" | awk '{print $2}')
            NEXT_CODE=$((CURRENT_CODE + 1))
            sed -i -E "s/versionCode [0-9]+/versionCode ${NEXT_CODE}/" "$GRADLE_FILE"
            echo "Incremented Android versionCode from ${CURRENT_CODE} to ${NEXT_CODE}"
          fi

          # 5. Commit release metadata and create git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): ${TAG}" || echo "Nothing to commit"

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" -m "Release ${TAG}"
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists on remote origin."
            git push origin HEAD:main || echo "Warning: Push to main skipped (branch protection active)"
          else
            git push origin HEAD:main "${TAG}" || {
              echo "Warning: Push to main branch failed (branch protection active). Pushing tag ${TAG} directly..."
              git push origin "${TAG}"
            }
          fi

          # 6. Create GitHub release draft
          NOTES_FILE=".changes/${TAG}.md"
          GH_ARGS=(release create "${TAG}" --title "Marvel Champions ${TAG}" --draft --prerelease)
          if [ -f "$NOTES_FILE" ]; then
            GH_ARGS+=(--notes-file "$NOTES_FILE")
          else
            GH_ARGS+=(--generate-notes)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on GitHub."
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "${TAG}" --notes-file "$NOTES_FILE"
            fi
          else
            gh "${GH_ARGS[@]}"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH_INPUT}" >> "$GITHUB_OUTPUT"

  desktop-builds:
    name: Desktop (${{ matrix.name }})
    needs: check-and-cut-release
    if: needs.check-and-cut-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x86_64)
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows 11 (x64)
            os: windows-latest
            args: ""
            rust-targets: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-cut-release.outputs.tag }}

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build Tauri desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCMD_SKIP_SENDTELEMETRY: "1"
        with:
          projectPath: packages/client
          args: ${{ matrix.args }}
          tagName: ${{ needs.check-and-cut-release.outputs.tag }}
          releaseName: Marvel Champions ${{ needs.check-and-cut-release.outputs.tag }}
          releaseDraft: true
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: marvel-champions-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            packages/client/src-tauri/target/**/release/bundle/dmg/*.dmg
            packages/client/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            packages/client/src-tauri/target/**/release/bundle/deb/*.deb
            packages/client/src-tauri/target/**/release/bundle/rpm/*.rpm
            packages/client/src-tauri/target/**/release/bundle/appimage/*.AppImage
            packages/client/src-tauri/target/**/release/bundle/msi/*.msi
            packages/client/src-tauri/target/**/release/bundle/nsis/*.exe

  android-build:
    name: Android Release APK
    needs: check-and-cut-release
    if: needs.check-and-cut-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-cut-release.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - run: pnpm install --frozen-lockfile

      - name: Setup Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'rocket' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS || 'marvel-champions' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'rocket' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > marvel-champions.keystore
            echo "Decoded keystore from repository secret."
          else
            echo "Generating self-signed release keystore for CI..."
            keytool -genkeypair -v -keystore marvel-champions.keystore \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Marvel Champions, OU=Game, O=Digital, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/marvel-champions.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'rocket' }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS || 'marvel-champions' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'rocket' }}
        run: pnpm android:build

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-and-cut-release.outputs.tag }}"
          APK_FILE=$(find dist/android release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Uploading ${APK_FILE} to release ${TAG}..."
            gh release upload "${TAG}" "${APK_FILE}" --clobber
          else
            echo "ERROR: Release APK not found."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: marvel-champions-android
          if-no-files-found: warn
          path: |
            release/*.apk

  finalize-release:
    name: Finalize Release Manifest
    needs: [check-and-cut-release, desktop-builds, android-build]
    if: needs.check-and-cut-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-cut-release.outputs.tag }}

      - name: Download all assets and generate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-and-cut-release.outputs.tag }}"
          mkdir -p release-assets
          gh release download "${TAG}" --dir release-assets

          cd release-assets
          rm -f SHA256SUMS.txt
          FILES=$(find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt")
          if [ -n "$FILES" ]; then
            sha256sum $FILES > SHA256SUMS.txt
            cat SHA256SUMS.txt
            echo "Uploading SHA256SUMS.txt..."
            gh release upload "${TAG}" SHA256SUMS.txt --clobber
          else
            echo "Warning: No release assets found to checksum."
          fi

      - name: Publish Release if requested
        if: needs.check-and-cut-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-and-cut-release.outputs.tag }}"
          echo "Publishing release ${TAG}..."
          gh release edit "${TAG}" --draft=false
