# The iOS app as an unsigned .ipa, one per card language (issue #874; scripts/build-ios.mjs).
#
# There is no Apple Developer account behind the game, so it can't go on the App Store or TestFlight. Players
# sideload the unsigned .ipa with a free Apple ID through SideStore, AltStore or Sideloadly, which sign it on install
# (docs/project/ios-install.md).
#
# release-on-merge.yml calls this as its `ios-build` job once it has tagged a release: the English .ipa goes up to the
# release as soon as it is built, and the other languages' wait for finalize-release, as the other installers do. A
# manual run from the Actions tab builds from the branch it runs on and keeps the .ipa as a workflow artifact only, as
# does a pull request that changes the iOS project or its build (English only there).
name: iOS build

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build from and attach the English .ipa to"
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-build.yml
      - scripts/build-ios.mjs
      - packages/client/ios/**
      - packages/client/capacitor.config.ts

# The build runs with a read-only token and keeps no git credentials: it runs the branch's own code (on a pull
# request too), and only the upload job below, which runs nothing from the checkout, may write to the release.
permissions:
  contents: read

jobs:
  ipa:
    name: iOS unsigned .ipa (${{ matrix.lang }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ github.event_name == 'pull_request' && fromJSON('["en"]') || fromJSON('["en", "es"]') }}
    env:
      MC_CARD_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch media assets
        uses: ./.github/actions/assets
        with:
          bundles: card-art music art${{ matrix.lang == 'es' && ' card-art-es' || '' }}

      - name: Build the unsigned .ipa
        env:
          # The production save-transfer Worker (save-data/transfer-config.ts); empty until the variable is set.
          VITE_SYNC_URL: >-
            ${{ (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN) && format('https://mc-sync.{0}.workers.dev',
            (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN)) || '' }}
        run: pnpm ios:build

      - uses: actions/upload-artifact@v7
        with:
          name: marvel-champions-ios-${{ matrix.lang }}
          if-no-files-found: error
          path: release/*.ipa

  # The English .ipa, attached to the release as soon as it is built. Other languages wait for finalize-release (see
  # the desktop upload in release-on-merge.yml). Only for a release tag: never on a pull request or a manual run.
  upload:
    name: Attach the English .ipa to the release
    needs: ipa
    # The English .ipa goes up even if the Spanish build failed.
    if: ${{ !cancelled() && inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: marvel-champions-ios-en
          path: ipa

      - name: Upload the .ipa to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ipa/*.ipa --clobber --repo "$GITHUB_REPOSITORY"

  # On a pull request, the English .ipa also goes up as the pre-release `ios-preview-pr-<number>` and is linked in a
  # PR comment, as the Android and Linux previews are (netlify-deploy.yml). Replaced on every push that rebuilds it and
  # deleted when the pull request closes (android-preview-cleanup.yml). Like `upload`, it runs nothing from the
  # checkout. Fork PRs get a read-only token, so they keep the workflow artifact only.
  preview:
    name: iOS preview .ipa
    needs: ipa
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TAG: ios-preview-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: marvel-champions-ios-en
          path: ipa

      - name: Publish the pre-release
        id: publish
        run: |
          built=$(find ipa -name "*-iOS-unsigned.ipa" | head -n 1)
          if [ ! -f "$built" ]; then
            echo "::error::The .ipa was not found in the build artifact."
            exit 1
          fi
          name="$(basename "$built" -iOS-unsigned.ipa)-PR${PR}-${HEAD_SHA:0:7}-iOS-unsigned.ipa"
          mv "$built" "$name"
          # Recreated on every push, so the tag sits on the commit the .ipa was built from.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> /dev/null || true
          gh release create "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --prerelease --target "$HEAD_SHA" \
            --title "iOS preview: PR #${PR}" \
            --notes "A test build of #${PR} at ${HEAD_SHA:0:7}, not a release. Unsigned: sideload it with SideStore, AltStore or Sideloadly (docs/project/ios-install.md). Deleted when the pull request closes."
          # A pull request that closed while this built already had its cleanup run (#472): take the preview down.
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state) || state=UNKNOWN
          if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
            echo "PR #${PR} closed while the preview built; deleting it."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            exit 0
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "iOS preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the .ipa link
        if: steps.publish.outputs.url != ''
        env:
          URL: ${{ steps.publish.outputs.url }}
        run: |
          marker="<!-- ios-preview -->"
          body="$marker
          **iOS preview .ipa (unsigned):** $URL (built from ${HEAD_SHA:0:7}; sideload it with SideStore, AltStore or Sideloadly)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
