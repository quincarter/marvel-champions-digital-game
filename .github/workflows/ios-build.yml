# The iOS app as an unsigned .ipa, one per card language (issue #874; scripts/build-ios.mjs).
#
# There is no Apple Developer account behind the game, so it can't go on the App Store or TestFlight. Players
# sideload the unsigned .ipa with a free Apple ID through SideStore, AltStore or Sideloadly, which sign it on install
# (docs/project/ios-install.md).
#
# release-on-merge.yml calls this as its `ios-build` job once it has tagged a release: the English .ipa goes up to the
# release as soon as it is built, and the other languages' wait for finalize-release, as the other installers do. A
# manual run from the Actions tab builds from the branch it runs on and keeps the .ipa as a workflow artifact only, as
# does a pull request that changes the iOS project or its build (English only there).
name: iOS build

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build from and attach the English .ipa to"
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-build.yml
      - scripts/build-ios.mjs
      - packages/client/ios/**
      - packages/client/capacitor.config.ts

permissions:
  contents: write

jobs:
  ipa:
    name: iOS unsigned .ipa (${{ matrix.lang }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ github.event_name == 'pull_request' && fromJSON('["en"]') || fromJSON('["en", "es"]') }}
    env:
      MC_CARD_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch media assets
        uses: ./.github/actions/assets
        with:
          bundles: card-art music art${{ matrix.lang == 'es' && ' card-art-es' || '' }}

      - name: Build the unsigned .ipa
        env:
          # The production save-transfer Worker (save-data/transfer-config.ts); empty until the variable is set.
          VITE_SYNC_URL: >-
            ${{ (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN) && format('https://mc-sync.{0}.workers.dev',
            (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN)) || '' }}
        run: pnpm ios:build

      # Other languages wait for finalize-release (see the desktop upload in release-on-merge.yml).
      - name: Upload the .ipa to the GitHub release
        if: inputs.tag != '' && matrix.lang == 'en'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" release/*.ipa --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: marvel-champions-ios-${{ matrix.lang }}
          if-no-files-found: error
          path: release/*.ipa
