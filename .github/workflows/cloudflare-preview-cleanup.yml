# Deletes a pull request's Cloudflare preview (netlify-deploy.yml's cloudflare-preview job: everything under `pr-<n>/`
# in the `mc-previews` R2 bucket) once the pull request closes, merged or not, so previews never linger in storage.
#
# The close can land while a preview is still uploading; that job deletes its own preview when it finds the pull request
# closed afterwards. The weekly sweep is the backstop: it deletes every `pr-<n>/` whose pull request isn't open, then
# the shared media (`shared/`) that no open preview's `files.json` lists, and can be run by hand from the Actions tab.
# R2 deletes are free operations, but each is one call against the API's 1,200 per 5 minutes: a closed preview is a few
# hundred, and a sweep with no pull request open deletes all of the shared media (about 11,000, some 50 minutes).
#
# Like the deploy, it skips with a notice until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist and the token can
# use the bucket (CONTRIBUTING.md, "Pull request previews on Cloudflare").
name: Cloudflare preview cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    name: Delete the Cloudflare preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/preview-worker
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: node packages/preview-worker/src/deploy/cli.ts cleanup --pr "$PR"

  sweep:
    name: Sweep Cloudflare previews of closed pull requests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/preview-worker
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: List the open pull requests
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        # A failed listing fails the job rather than sweep every preview as closed.
        run: |
          set -o pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number' | tr '\n' ' ')
          echo "Open pull requests: ${open:-none}"
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN: ${{ steps.open.outputs.open }}
        run: node packages/preview-worker/src/deploy/cli.ts sweep --open "$OPEN"
