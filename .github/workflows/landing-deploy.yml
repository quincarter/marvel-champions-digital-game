# Every deploy of the landing page (champions-digital-game.com, the assets-only Worker `mc-landing`) runs here, in one
# concurrency group, so two never overlap:
#
#   - CI (netlify-deploy.yml, deploy-landing-main) calls it on every push to main, once that push's site builds pass;
#   - release-on-merge.yml calls it after "Publish Release". The push that merged the release PR built the page while
#     that release was still a draft, and the page holds back news and report screenshots newer than GitHub's latest
#     release (src/site/landing/published.ts) and bakes in the latest release's downloads, so it needs this second
#     build to show the new version;
#   - it runs by hand from the Actions tab (or `gh workflow run landing-deploy.yml`) after a draft release is published.
#   - it runs twice a day on a schedule, so the download stats page (/stats/), which counts GitHub's release downloads
#     at build time, stays current. A scheduled run first compares GitHub's counts with the ones the live site
#     published (scripts/download-stats-changed.mjs) and stops there when no one has downloaded anything since.
#
# The job builds inside the group, from main as it is when the job starts and with GitHub's latest release as it is
# then, never from a build made before it waited. If main has moved on by the time the build is done, it doesn't deploy:
# the push that moved main has a run of its own queued behind this one, which builds the newer commit.
name: Deploy the landing page

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # 06:17 and 18:17 UTC: off the hour, when GitHub's scheduler is least busy.
    - cron: "17 6,18 * * *"

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy the landing page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: mc-landing-deploy
      cancel-in-progress: false
    steps:
      # A scheduled run's event carries no repository, so its default branch falls back to the ref it runs on, which
      # for a schedule is the default branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet; skipping the landing page deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      # A scheduled run deploys only when the download counts moved; a push, a release or a run by hand always deploys.
      - name: Check whether the download counts changed
        id: counts
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/download-stats-changed.mjs
      - if: steps.secrets.outputs.ready == 'true' && steps.counts.outputs.changed != 'false'
        run: pnpm install --frozen-lockfile
      # The title wallpapers and the hero and villain art; the screenshots come from the release reports, in git.
      - name: Fetch the art
        if: steps.secrets.outputs.ready == 'true' && steps.counts.outputs.changed != 'false'
        uses: ./.github/actions/assets
        with:
          bundles: art
      - name: Build
        if: steps.secrets.outputs.ready == 'true' && steps.counts.outputs.changed != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Fail rather than ship the stats page without its numbers if GitHub doesn't answer; the live page stays.
          STATS_REQUIRED: "1"
        run: pnpm --filter @mc/client site:build:landing
      - name: Check that main hasn't moved on
        id: current
        if: steps.secrets.outputs.ready == 'true' && steps.counts.outputs.changed != 'false'
        env:
          BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          built=$(git rev-parse HEAD)
          now=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$built" != "$now" ]; then
            echo "::notice::main moved from $built to $now during the build; the newer commit's own run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: >-
          steps.secrets.outputs.ready == 'true' && steps.counts.outputs.changed != 'false' &&
          steps.current.outputs.deploy == 'true'
        working-directory: packages/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The sync Worker's pinned wrangler, so the repo carries one version of it.
        run: pnpm --filter @mc/sync-worker exec wrangler deploy --config "$PWD/wrangler.landing.jsonc"
