# Rebuilds and deploys the landing page (champions-digital-game.com, the assets-only Worker `mc-landing`) from main,
# outside a push. CI's deploy-landing job (netlify-deploy.yml) deploys it on every push to main; this one runs when a
# release is published (release-on-merge.yml calls it after "Publish Release"), because the push that merged the release
# PR built the page while that release was still a draft. The page holds back news and report screenshots newer than
# GitHub's latest release (src/site/landing/published.ts), and bakes in the latest release's downloads, so it needs
# this second build to show the new version. Run it by hand from the Actions tab after publishing a draft release.
name: Deploy the landing page

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the landing page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same steps as deploy-landing in netlify-deploy.yml: the title wallpapers and the hero and villain art.
      - name: Fetch the art
        uses: ./.github/actions/assets
        with:
          bundles: art
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @mc/client site:build:landing
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet; skipping the landing page deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @mc/sync-worker exec wrangler deploy --config "$PWD/wrangler.landing.jsonc"
