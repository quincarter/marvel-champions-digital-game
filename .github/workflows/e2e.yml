# Guided-mode end-to-end regression (`docs/guided-mode.md` §4 G11, `packages/client/e2e/`): a small Playwright
# suite that drives the tutorial through a real headless browser against the client's own Vite dev server, so the
# guided flow can't silently break. Needs no secrets and stays cheap (one Chromium install, one dev-server boot),
# so unlike the desktop/mobile build workflows this runs directly on pull requests rather than being dispatch-only.
name: Guided-mode e2e

on:
  pull_request:
    paths:
      - "packages/client/**"
      - "packages/engine/**"
      - "packages/cards/**"
      - "packages/content/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tutorial e2e (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @mc/client exec playwright install --with-deps chromium
      - name: Run guided-mode e2e
        run: pnpm --filter @mc/client e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 14
