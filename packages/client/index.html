<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marvel Champions</title>
    <!--
      The only DOM in the app. Phaser draws every screen (PLAN.md Phase 4), so
      this page exists to host the canvas and nothing else. VOID (#0E0C0A) is
      the design system's canvas-behind-screens colour, so the page never
      flashes white before the game boots.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0e0c0a;
        color-scheme: dark;
      }
      /*
        The game sits inside the safe area, so a notch, a Dynamic Island or the
        home indicator never covers a control; VOID fills the insets. With
        Phaser's RESIZE scale mode the canvas takes this box's size, so scenes
        lay out against the safe rect with no inset logic of their own. Every
        inset is 0 on desktop, so this is the whole-window box there.
      */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
